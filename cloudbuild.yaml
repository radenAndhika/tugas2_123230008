steps:
  # ─── Step 1: Build Docker Image ─────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/notes-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/notes-app:latest'
      - '.'

  # ─── Step 2: Push Image ke Container Registry ───────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/notes-app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/notes-app:latest'

  # ─── Step 3: Deploy ke Cloud Run ────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'notes-app'
      - '--image=gcr.io/$PROJECT_ID/notes-app:$COMMIT_SHA'
      - '--region=asia-southeast2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--set-env-vars=DB_HOST=$_DB_HOST,DB_NAME=$_DB_NAME,DB_USER=$_DB_USER,DB_PASS=$_DB_PASS'

# Image yang akan disimpan di Container Registry
images:
  - 'gcr.io/$PROJECT_ID/notes-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/notes-app:latest'

# Substitution variables (isi di trigger Cloud Build atau saat manual trigger)
substitutions:
  _DB_HOST: '34.101.188.44'
  _DB_NAME: 'tugas2'
  _DB_USER: '123230008'
  _DB_PASS: ''   # Sebaiknya pakai Secret Manager, jangan taruh plain text

options:
  logging: CLOUD_LOGGING_ONLY
